[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "authorfinder"
version = "0.2.0"
description = "Extract journalist/author contact information from a news article URL."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
playwright = ["playwright>=1.30"]
dev = ["pytest>=7.0"]

[project.scripts]
authorfinder = "authorfinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
